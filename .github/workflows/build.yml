name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install re2 dylibbundler

      # Upstream C++ test suite (engine code is unchanged in this fork).
      # Non-blocking for now; full output is uploaded as an artifact.
      - name: Core tests (fast)
        continue-on-error: true
        run: |
          set -o pipefail
          make test-fast 2>&1 | tee core-tests.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests-log
          path: core-tests.log

      - name: Build app (unsigned)
        run: |
          xcodebuild -project MacEverything.xcodeproj -scheme MacEverything \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            SYMROOT=build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" build

      - name: Bundle Homebrew dylibs into the app
        run: |
          APP=build/Release/MacEverything.app
          dylibbundler -od -b -cd \
            -x "$APP/Contents/MacOS/MacEverything" \
            -d "$APP/Contents/Frameworks" \
            -p @executable_path/../Frameworks/
          # Fail if anything still points at Homebrew
          ! otool -L "$APP/Contents/MacOS/MacEverything" | grep -q /opt/homebrew
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"

      - name: Package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" MacEverything/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          ditto -c -k --keepParent build/Release/MacEverything.app "dist/JMacEverything-$VERSION-arm64.zip"
          hdiutil create -volname JMacEverything -srcfolder build/Release/MacEverything.app \
            -ov -format UDZO "dist/JMacEverything-$VERSION-arm64.dmg"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: JMacEverything-macos-arm64
          path: dist/*

      # Release when main carries a version that has no release yet
      # (bump CFBundleShortVersionString in Info.plist and push), or on a v* tag.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "JMacEverything $TAG" \
            --notes-file FORK_CHANGES.md
