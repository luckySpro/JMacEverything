name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install re2 dylibbundler

      # Upstream C++ test suite (engine code is unchanged in this fork).
      # Non-blocking for now; full output is uploaded as an artifact.
      - name: Core tests (fast)
        continue-on-error: true
        run: |
          set -o pipefail
          make test-fast 2>&1 | tee core-tests.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests-log
          path: core-tests.log

      - name: Build app (unsigned)
        shell: bash
        run: |
          set +e
          xcodebuild -project MacEverything.xcodeproj -scheme MacEverything \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            SYMROOT=build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" build > xcodebuild.log 2>&1
          status=$?
          # Surface compiler errors as annotations (readable from the Checks API)
          grep -E "^/.*:[0-9]+:[0-9]+: error: " xcodebuild.log \
            | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/([^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#' \
            | sort -u | head -40
          tail -30 xcodebuild.log
          exit $status

      - name: Bundle Homebrew dylibs into the app
        run: |
          APP=build/Release/JMacEverything.app
          BINS=("$APP/Contents/MacOS/JMacEverything")
          [ -f "$APP/Contents/MacOS/MacEverythingMCP" ] && BINS+=("$APP/Contents/MacOS/MacEverythingMCP")
          ARGS=(); for b in "${BINS[@]}"; do ARGS+=(-x "$b"); done
          dylibbundler -od -b -cd "${ARGS[@]}" \
            -d "$APP/Contents/Frameworks" \
            -p @executable_path/../Frameworks/
          # Fail if anything still points at Homebrew
          for b in "${BINS[@]}" "$APP"/Contents/Frameworks/*.dylib; do
            if otool -L "$b" | grep -q /opt/homebrew; then echo "::error::$b still links Homebrew"; exit 1; fi
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"

      - name: Package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" MacEverything/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          ditto -c -k --keepParent build/Release/JMacEverything.app "dist/JMacEverything-$VERSION-arm64.zip"
          # DMG with an Applications shortcut: open it and drag the app across
          STAGE=$(mktemp -d)
          cp -R build/Release/JMacEverything.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname JMacEverything -srcfolder "$STAGE" \
            -ov -format UDZO "dist/JMacEverything-$VERSION-arm64.dmg"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: JMacEverything-macos-arm64
          path: dist/*

      # Release when main carries a version that has no release yet
      # (bump CFBundleShortVersionString in Info.plist and push), or on a v* tag.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "JMacEverything $TAG" \
            --notes-file FORK_CHANGES.md
